name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - name: Unit + integration tests
        run: pytest -m "not eval"
      - name: Eval gate (fails below EVAL_PASS_THRESHOLD)
        run: pytest -m eval
        env:
          EVAL_PASS_THRESHOLD: "0.85"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # `next build` type-checks and generates the route types (LayoutProps etc.) that a
      # standalone `tsc` needs, so build first, then re-check with tsc.
      - run: npm run build
      - run: npx tsc --noEmit
